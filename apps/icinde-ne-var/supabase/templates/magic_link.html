<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Kodu</title>
  <style>
    body { margin: 0; padding: 0; background-color: #F5F0EB; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .container { max-width: 480px; margin: 0 auto; padding: 40px 24px; }
    .card { background: #FFFFFF; border-radius: 16px; padding: 32px 24px; text-align: center; }
    .logo { font-size: 40px; margin-bottom: 8px; }
    .title { font-size: 22px; font-weight: 700; color: #1C1917; margin: 0 0 8px; }
    .subtitle { font-size: 14px; color: #78716C; margin: 0 0 24px; }
    .otp-code { font-size: 36px; font-weight: 800; letter-spacing: 8px; color: #0F766E; background: #F0FDFA; border-radius: 12px; padding: 16px 24px; margin: 0 0 24px; display: inline-block; }
    .note { font-size: 13px; color: #A8A29E; margin: 0; }
    .footer { text-align: center; padding: 24px; font-size: 12px; color: #A8A29E; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">🔬</div>
      <h1 class="title">İçinde Ne Var?</h1>
      <p class="subtitle">Giriş kodunuz aşağıdadır</p>
      <div class="otp-code">{{ .Token }}</div>
      <p class="note">Bu kod 60 dakika geçerlidir. Kodu kimseyle paylaşmayın.</p>
    </div>
    <div class="footer">
      Bu e-postayı siz talep etmediyseniz güvenle yoksayabilirsiniz.
    </div>
  </div>
</body>
</html>
